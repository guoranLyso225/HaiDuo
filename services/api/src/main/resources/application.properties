spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/haiduo}
spring.datasource.username=${DB_USER:haiduo}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:localhost}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
spring.session.store-type=redis
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
logging.pattern.level=%5p [request:%X{requestId:-none}]
haiduo.messaging.enabled=${MESSAGING_ENABLED:false}
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.username=${RABBIT_USER:haiduo}
spring.rabbitmq.password=${RABBIT_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=3000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

management.tracing.sampling.probability=0.1

spring.session.data.redis.namespace=haiduo:session:v4
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

management.tracing.export.enabled=${TRACING_ENABLED:false}
management.tracing.export.otlp.enabled=${TRACING_ENABLED:false}

management.otlp.metrics.export.enabled=false
