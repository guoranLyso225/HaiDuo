name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  woocommerce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '24.22.1'
      - name: Prepare local-only integration credentials
        run: |
          password=$(openssl rand -hex 24)
          encryption=$(openssl rand -base64 32)
          printf '%s' "$password" > .demo-password
          printf 'DB_PASSWORD=%s\nRABBIT_PASSWORD=%s\nDEMO_PASSWORD=%s\nCOOKIE_SECURE=false\nTOKEN_ENCRYPTION_KEY=%s\n' "$password" "$password" "$password" "$encryption" > .env
      - name: Start local WooCommerce and HaiDuo
        shell: pwsh
        run: ./infra/start-woocommerce-link.ps1
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify real local platform connection
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:8088
        run: npx playwright test -c playwright.woocommerce.config.ts
      - name: Verify webhook and fulfillment contribution
        shell: pwsh
        run: ./infra/verify-woocommerce-fulfillment.ps1
      - name: Verify automatic webhook queue delivery
        shell: pwsh
        run: ./infra/verify-woocommerce-webhooks.ps1 -QueueOnly
      - if: always()
        name: Diagnose local platform event processing
        run: |
          docker compose --env-file .env -f infra/compose.yml -f infra/compose.woo-link.yml logs --tail 400 api
          docker compose --env-file .env -f infra/compose.yml exec -T postgres psql -U haiduo -d haiduo -c "select kind,status,count(*) from outbox_event group by kind,status order by kind,status; select type,status,count(*) from sync_job group by type,status; select store,external_id,status,payment_status from sales_order order by created_at;"
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yml -f infra/compose.woo-link.yml down
      - if: always()
        run: docker compose --env-file .woo.env -f infra/compose.woocommerce.yml --profile webhooks down
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Validate monitoring configuration
        run: docker run --rm --entrypoint promtool -v "$PWD/infra/monitoring:/etc/prometheus:ro" prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.yml
      - name: Test alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/infra/monitoring:/rules:ro" -w /rules prom/prometheus:v3.7.3 test rules alerts.test.yml
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_TESTCONTAINERS: 'true'
      RUN_DATABASE_TESTS: 'true'
      RUN_MESSAGING_TESTS: 'true'
      RUN_SYNC_TESTS: 'true'
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -s infra/maven-settings.xml -f services/api/pom.xml '-Dtest=InventoryContainerTest,MessagingContainerTest,SyncContainerTest,ShopifyAdapterTest,BlobContractTest,ProfitTest,RequestCorrelationTest,KnowledgeContainerTest,VectorContainerTest,ModelAdapterTest,TrackingSnapshotContainerTest,ArchitectureTest,RoleTest,WooCommerceAdapterTest' verify
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '24.22.1'
      - name: Prepare isolated demo environment
        run: |
          password=$(openssl rand -hex 24)
          printf '%s' "$password" > .demo-password
          printf 'DB_PASSWORD=%s\nRABBIT_PASSWORD=%s\nDEMO_PASSWORD=%s\nVECTOR_DB_PASSWORD=%s\nCOOKIE_SECURE=false\nAI_DEMO=true\nSEARCH_URL=http://opensearch:9200\nVECTOR_DATABASE_URL=jdbc:postgresql://vector:5432/knowledge\nVECTOR_DB_USER=haiduo\n' "$password" "$password" "$password" "$password" > .env
      - run: docker compose --env-file .env -f infra/compose.yml -f infra/compose.enhanced.yml --profile search --profile ai up -d --build --wait --wait-timeout 180
      - working-directory: apps/web
        run: npm ci --ignore-scripts
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:8088
        run: npx playwright test
      - name: Backup and isolated restore drill
        shell: pwsh
        run: ./infra/verify-backup-restore.ps1 -RunId ci-restore
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yml -f infra/compose.enhanced.yml logs --tail 100
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yml -f infra/compose.enhanced.yml down
