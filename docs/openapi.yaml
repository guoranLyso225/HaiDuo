openapi: 3.0.3
info:
  title: 海舵核心与阶段二接口
  version: 0.4.0
  description: 核心闭环契约；完整路径和当前限制见API.md。金额为十进制字符串，租户范围来自会话。
servers:
  - url: http://localhost:8088
security:
  - session: []
paths:
  /api/session/csrf:
    get:
      security: []
      summary: 获取CSRF令牌，登录后需重新获取
      responses:
        '200':
          description: token与headerName
  /api/session/login:
    post:
      security:
        - csrf: []
      summary: 服务器会话登录
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '204': {description: 登录成功，轮换会话ID}
        '401': {description: 凭据错误}
        '403': {description: CSRF无效}
  /api/products:
    get:
      summary: 当前企业SKU服务器分页
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 200}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: SKU数组，cost是人民币十进制字符串，含productName与archived；支持当前编码及历史别名搜索
          headers:
            X-Total-Count: {schema: {type: integer}, description: 当前过滤条件总数}
    post:
      security: [{session: [], csrf: []}]
      summary: ADMIN或OPERATIONS创建商品SKU及各仓零库存
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, cost]
              properties:
                code: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
                name: {type: string, maxLength: 200}
                cost: {$ref: '#/components/schemas/Decimal'}
      responses:
        '201': {description: 新商品id}
        '409': {description: SKU已存在}
  /api/orders/import:
    post:
      summary: ADMIN或OPERATIONS原子CSV导入，重复订单跳过
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: {type: string, maxLength: 100000, description: 'store,order_no,sku,quantity,net,currency,rate；同单可多行SKU，整单金额重复不累加'}
                warehouseId: {type: string, format: uuid, description: 省略时默认仓库}
                requestKey: {type: string, format: uuid, description: 同一次确认重试复用}
                previewDigest: {type: string, minLength: 64, maxLength: 64, description: 预览摘要，确认时重新校验}
      responses:
        '200': {description: imported、duplicates、batchId及status；重复请求键返回原批次结果}
        '400': {description: 格式错误或SKU/店铺不存在}
        '404': {description: 仓库不属当前企业}
        '409': {description: 预览已过时或请求键内容冲突}
  /api/orders/{id}/{action}:
    post:
      summary: ADMIN或OPERATIONS预占或取消；释放后再次预占正文须提供当前revision
      security: [{session: [], csrf: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [reserve, cancel]}}
      responses:
        '200': {description: 成功或相同状态重复请求}
        '404': {description: 对象不存在或跨企业}
        '409': {description: 库存不足或状态冲突}
  /api/orders/{id}/shipment:
    post:
      summary: ADMIN或WAREHOUSE整单手工发货，L1提交待审批申请
      security: [{session: [], csrf: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier, trackingNumber]
              properties:
                carrier: {type: string, maxLength: 100}
                trackingNumber: {type: string, maxLength: 100}
      responses:
        '200': {description: 库存及运单事务成功}
        '409': {description: 状态或运单冲突}
  /api/inventory/receipts:
    post:
      summary: ADMIN或WAREHOUSE幂等入库，L1创建待审批申请，L2及以上直接生效
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey, skuId, quantity]
              properties:
                requestKey: {type: string, format: uuid}
                skuId: {type: string, format: uuid}
                warehouseId: {type: string, format: uuid}
                quantity: {type: integer, minimum: 1, maximum: 1000000}
      responses:
        '200': {description: 'id、status及duplicate；PENDING尚未增加库存，APPLIED已生效，终态重复请求不再入库'}
        '409': {description: 同键不同请求或库存上限}
  /api/profits:
    get:
      summary: ADMIN或FINANCE查询预估人民币经营贡献
      responses:
        '200': {description: 十进制字符串金额；缺历史成本时contribution为null，basis为ESTIMATED}
  /api/sync:
    get:
      summary: 管理员和运营读取当前企业最近100条事件和任务
      responses:
        '200': {description: outbox与jobs数组，SENT不表示业务完成}
        '403': {description: 无查看权限}
  /api/sync/{id}/replay:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员重放失败事件
      responses:
        '200': {description: 已重新排队}
        '403': {description: 无权限}
        '404': {description: 不存在或不属本企业}
        '409': {description: 正在处理或已完成}
  /api/stores/{id}/sync:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 排队读取订单，MOCK为固定模拟
      responses:
        '200': {description: QUEUED不表示已导入}
        '409': {description: Shopify尚未授权或缺同步配置}
  /api/stores/{id}/sync-settings:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员和财务保存后续新订单使用的仓库与汇率
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, currency, rate, source]
              properties:
                warehouseId: {type: string, format: uuid}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                rate: {type: string, example: '7.2'}
                source: {type: string, maxLength: 100}
      responses:
        '200': {description: 已保存，不改写历史汇率}
        '400': {description: 参数错误或CNY汇率不为1}
  /api/shopify/{id}/authorize:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员创建只读订单OAuth链接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shop]
              properties:
                shop: {type: string, example: example.myshopify.com}
      responses:
        '200': {description: url，state绑定当前会话}
        '503': {description: 缺少真实凭据或配置}
  /api/shopify/callback:
    get:
      summary: 原认证会话的一次性OAuth回调，校验state和HMAC
      responses:
        '200': {description: 加密保存令牌并连接店铺}
        '403': {description: 签名或state无效}
  /api/webhooks/shopify:
    post:
      security: []
      summary: 原始请求体HMAC验签并可靠落库，后台重新查询权威状态
      parameters:
        - {name: X-Shopify-Hmac-Sha256, in: header, required: true, schema: {type: string}}
        - {name: X-Shopify-Shop-Domain, in: header, required: true, schema: {type: string}}
        - {name: X-Shopify-Webhook-Id, in: header, required: true, schema: {type: string, maxLength: 128}}
        - {name: X-Shopify-Event-Id, in: header, schema: {type: string, maxLength: 128}}
        - {name: X-Shopify-Topic, in: header, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        '202': {description: 已可靠接收、重复或不支持topic}
        '401': {description: 签名无效或店铺未绑定}
        '413': {description: 请求体超过1MB}
        '503': {description: 未启用凭据}
  /api/products/{id}/image:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员或运营上传当前企业SKU图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: PNG/JPEG最多2MB及4096像素}
      responses:
        '200': {description: 文件id与授权读取url}
        '400': {description: 非法图片}
        '404': {description: SKU不存在或不属本企业}
  /api/files/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 授权成员读取当前企业文件，no-store
      responses:
        '200': {description: PNG/JPEG二进制}
        '404': {description: 不存在或不属本企业}
  /api/search:
    get:
      summary: 当前企业增强搜索，故障或关闭时降级数据库
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
      responses:
        '200': {description: engine及最多50条items}
  /api/search/reindex:
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员重建当前企业索引，最多5000商品
      responses:
        '200': {description: indexed数量}
        '503': {description: 增强搜索未启用}
  /api/ai/status:
    get:
      summary: 当前企业AI状态及额度上限
      responses:
        '200': {description: mode为DISABLED或FIXED_DEMO或MODEL}
  /api/ai/knowledge:
    get:
      summary: 当前企业知识库文档清单
      responses:
        '200': {description: 企业限定文档数组}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员或运营导入文本/Markdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, text]
              properties:
                title: {type: string, maxLength: 200}
                text: {type: string, maxLength: 12000}
      responses:
        '200': {description: 文档id与切分数量及mode}
        '429': {description: 超出企业UTC每日100模型调用额度}
        '503': {description: 模型未启用}
  /api/ai/ask:
    post:
      security: [{session: [], csrf: []}]
      summary: 租户隔离检索并回答，资料不足明确说明
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, maxLength: 4000}
      responses:
        '200': {description: answer与来源documentId/title/chunk及mode}
        '503': {description: 模型未启用}
  /api/ai/drafts:
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员或运营生成待审核商品文案，不发布
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, instructions]
              properties:
                skuId: {type: string, format: uuid}
                instructions: {type: string, maxLength: 4000}
      responses:
        '200': {description: id/content/PENDING_REVIEW及mode}
        '404': {description: SKU不存在或不属本企业}
  /api/roles:
    get:
      summary: 管理员读取固定角色及权限
      responses:
        '200': {description: 角色与权限清单}
  /api/shipments/{id}/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 当前企业运单的模拟事件列表
      responses:
        '200': {description: 最多200条MOCK事件，包含applied标识}
        '404': {description: 不存在或不属本企业}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员或仓库提交幂等模拟物流事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventKey, version, status, occurredAt]
              properties:
                eventKey: {type: string, format: uuid}
                version: {type: integer, minimum: 1}
                status: {type: string, enum: [IN_TRANSIT, DELIVERED, EXCEPTION]}
                occurredAt: {type: string, format: date-time}
      responses:
        '200': {description: duplicate和applied；旧事件不回退状态}
        '409': {description: 幂等键或版本冲突}
  /api/exchange-rate-snapshots:
    get:
      summary: 管理员和财务查看当前企业不可变汇率快照
      responses:
        '200': {description: 最近200条，rate为十进制字符串}
  /api/orders/{id}/profit-confirmations:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 人工核对实际经营贡献并追加不可变版本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey, source]
              properties:
                requestKey: {type: string, format: uuid}
                source: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200': {description: MANUALLY_CONFIRMED_ACTUAL，不代表自动结算}
        '409': {description: 未付款/未发货/退款中/成本或费用不完整/幂等冲突}
  /api/profit-confirmations:
    get:
      summary: 管理员和财务查看当前企业实际贡献版本
      responses:
        '200': {description: 最近200条不可变人工确认记录}
  /api/orders/export.csv:
    get:
      summary: 管理员运营财务导出当前企业CSV，默认近30天，最多5000单
      parameters:
        - {name: store, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: UTF8 CSV下载，防公式注入，no-store}
        '409': {description: 超5000单，需缩小时间范围}
  /api/products/{productId}/skus:
    parameters:
      - {name: productId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员或运营在当前企业商品下新增SKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, cost]
              properties:
                code: {type: string, maxLength: 64}
                name: {type: string, maxLength: 200}
                cost: {type: string, example: '200.00'}
      responses:
        '201': {description: SKU id及productId}
        '404': {description: 商品不存在或不属本企业}
        '409': {description: SKU重复}
  /api/ai/knowledge/index:
    get:
      summary: 管理员查看当前企业派生向量索引状态与主库片段数
      responses:
        '200': {description: enabled、chunks、basis；不调用模型}
        '403': {description: 需要当前企业管理员角色}
  /api/ai/knowledge/index/rebuild:
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员用当前企业主库已有向量重建独立索引并清理孤立记录
      responses:
        '200': {description: indexedChunks、modelCalls为0；重复重建不增加向量记录}
        '403': {description: 需要当前企业管理员角色}
        '503': {description: 未配置独立向量库，主库检索无需重建}
        '502': {description: 重建未确认成功，可安全重试}
  /api/woocommerce/status:
    get:
      summary: 管理员读取服务端可信WooCommerce地址，不返回密钥
      responses:
        '200': {description: baseUrl为空表示尚未启用}
        '403': {description: 需要企业管理员}
  /api/woocommerce/{id}/connect:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{session: [], csrf: []}]
      summary: 验证只读订单访问并加密保存当前企业WooCommerce连接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl, consumerKey, consumerSecret]
              properties:
                baseUrl: {type: string}
                consumerKey: {type: string, writeOnly: true}
                consumerSecret: {type: string, writeOnly: true}
                webhookSecret: {type: string, writeOnly: true, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: 已连接，密钥不回传}
        '400': {description: 地址不在服务端白名单或输入无效}
        '403': {description: 非管理员}
        '404': {description: 对象不属于当前企业或非Woo店铺}
        '409': {description: 该店铺地址已绑定另一企业或店铺}
        '502': {description: 订单读取验证失败}
        '503': {description: 功能或加密密钥未配置}
  /api/webhooks/woocommerce/{store}:
    parameters:
      - {name: store, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      security: []
      summary: 使用绑定店铺独立密钥验原始请求体HMAC后可靠入队
      description: 不使用浏览器会话；支持order.created和order.updated；相同原始载荷按企业和店铺去重，后台重新读取权威订单。
      parameters:
        - {name: X-WC-Webhook-Signature, in: header, required: true, schema: {type: string}}
        - {name: X-WC-Webhook-Topic, in: header, required: true, schema: {type: string}}
        - {name: X-WC-Webhook-Delivery-ID, in: header, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '202': {description: 已可靠接收或重复事件；未知topic忽略}
        '401': {description: 签名或绑定无效}
        '413': {description: 请求体超过1MB}
        '503': {description: 尚未配置Webhook密钥}
  /api/approvals/profile:
    get:
      summary: 当前企业角色、职级及用户名
      responses:
        '200': {description: role、grade、username}
  /api/approvals/sku/{id}:
    get:
      summary: SKU编辑数据及版本（编码只读）
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: id、code、name、cost十进制字符串、version}
        '404': {description: 当前企业对象不存在}
  /api/approvals:
    get:
      summary: 当前企业SKU申请列表，普通成员仅自己的，主管可查企业记录
      responses:
        '200': {description: 最近200条，成本以十进制字符串返回}
    post:
      security: [{session: [], csrf: []}]
      summary: SKU编辑保存或提交审批，禁止绕过财务权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, version, name, cost, reason, requestKey]
              properties:
                skuId: {type: string, format: uuid}
                version: {type: integer, format: int64}
                name: {type: string, maxLength: 200}
                cost: {$ref: '#/components/schemas/Decimal'}
                reason: {type: string, maxLength: 500}
                requestKey: {type: string, format: uuid}
      responses:
        '200': {description: id及PENDING或APPLIED，不得将PENDING视作已生效}
        '403': {description: 无编辑或财务权限}
        '409': {description: 数据版本或幂等键冲突}
  /api/approvals/{id}:
    post:
      security: [{session: [], csrf: []}]
      summary: 独立审批、驳回或申请人撤回，同事务执行，重复审批不重复生效
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, reject, withdraw]}
                comment: {type: string, maxLength: 500}
      responses:
        '200': {description: APPLIED、STALE、EXPIRED、WITHDRAWN或REJECTED等当前状态}
        '403': {description: 自审、职级或职责不足}
        '404': {description: 当前企业申请不存在}
  /api/approvals/grade:
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员配置其他非管理员职级，上调须独立管理员批准，下调直接生效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, grade]
              properties:
                username: {type: string}
                grade: {type: integer, minimum: 1, maximum: 3}
      responses:
        '200': {description: 'APPLIED已生效或PENDING待独立管理员审批，禁止自我提级'}
        '403': {description: 仅企业管理员可配置}
  /api/corrections:
    get:
      summary: 当前企业库存纠错申请，普通成员仅自己的，主管可查企业记录
      responses:
        '200': {description: 最近200条申请及当前单据明细}
    post:
      security: [{session: [], csrf: []}]
      summary: 申请释放预占、整笔入库冲销或CSV批次撤销，所有职级均待独立审批
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, targetId, reason, requestKey]
              properties:
                kind: {type: string, enum: [RELEASE, RECEIPT_REVERSE, CSV_ROLLBACK]}
                targetId: {type: string, format: uuid}
                reason: {type: string, maxLength: 500}
                requestKey: {type: string, format: uuid}
      responses:
        '200': {description: id及PENDING，库存尚未改变}
        '403': {description: 职责权限不足}
        '404': {description: 当前企业对象不存在}
        '409': {description: 不可操作状态或请求键冲突}
  /api/corrections/{id}:
    post:
      security: [{session: [], csrf: []}]
      summary: 独立审核纠错，申请与业务状态加锁，同事务执行
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, reject, withdraw]}
                comment: {type: string, maxLength: 500}
      responses:
        '200': {description: 当前状态，APPLIED才改变业务；重复审核无重复副作用}
        '403': {description: 自审、职级或职责不符}
        '404': {description: 当前企业申请不存在}
        '409': {description: 库存不足或预占不一致，全部回滚且申请仍待处理}
  /api/corrections/receipts:
    get:
      summary: ADMIN或WAREHOUSE查询当前仓库入库与冲销状态
      parameters:
        - {name: warehouseId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 最近200笔入库，不含其他企业数据}
        '403': {description: 无入库查询权限}
  /api/orders/import/preview:
    post:
      security: [{session: [], csrf: []}]
      summary: ADMIN或OPERATIONS只读CSV预览，不创建订单或批次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: {type: string, maxLength: 100000}
                warehouseId: {type: string, format: uuid}
      responses:
        '200': {description: orders、逐行errors、imported、duplicates、digest、canImport；错误时整批不能确认}
        '400': {description: 请求过长或无效}
        '404': {description: 当前企业仓库不存在}
  /api/order-imports:
    get:
      summary: ADMIN或OPERATIONS查询当前企业最近200个CSV批次
      responses:
        '200': {description: 批次编号、创建人、仓库、新增/重复计数及状态，不存储原始CSV}
        '403': {description: 角色无权限}
  /api/order-imports/{id}:
    get:
      summary: 批次详情及当前可撤销条件，仅列本批真正新增订单
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: batch、orders、blocked、canRollback及pending；撤销仍需独立审批}
        '404': {description: 当前企业批次不存在}
  /api/receipt-approvals:
    get:
      summary: 当前企业普通入库审批，普通成员仅本人，主管可看当前企业最近200条
      responses:
        '200': {description: 申请键、SKU、仓库、数量、申请人、状态、意见及时间}
  /api/receipt-approvals/{id}:
    post:
      security: [{session: [], csrf: []}]
      summary: 独立仓库主管或管理员审批普通入库，申请人可撤回
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, reject, withdraw]}
                comment: {type: string, maxLength: 500}
      responses:
        '200': {description: status；重复处理不重复增加库存}
        '403': {description: 职责或职级不足、自审、申请人权限已撤回}
        '404': {description: 当前企业申请不存在}
        '409': {description: 库存超过上限，事务回滚且保持待审批}
  /api/workflows:
    get:
      summary: 当前企业通用业务审批，普通成员仅本人，主管最近200条
      responses:
        '200': {description: 固定申请载荷、提交时状态、审批人、结果及时间；不含密码或凭据}
  /api/workflows/{id}:
    post:
      security: [{session: [], csrf: []}]
      summary: 独立合格主管审批，权限变更须独立管理员；业务与状态同事务
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, reject, withdraw]}
                comment: {type: string, maxLength: 500}
      responses:
        '200': {description: status及可选result；APPLIED、REJECTED、WITHDRAWN、EXPIRED、STALE，重复不重做}
        '403': {description: 自审、职责或等级不足、成员权限已撤销}
        '404': {description: 当前企业申请不存在}
        '409': {description: 业务执行条件冲突，事务回滚且申请保持待审批}
  /api/workflows/{id}/resubmit:
    post:
      security: [{session: [], csrf: []}]
      summary: 申请人对驳回、撤回或过期申请重新提交，重复调用返回同一后继请求
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 新申请或已生效结果，原申请历史保留}
        '409': {description: 状态已变化时须回原页面重新编辑或预览}
  /api/business-edits:
    post:
      security: [{session: [], csrf: []}]
      summary: 编辑商品/订单/运单或申请归档、别名、盘点、部分冲销、退货；按职级及类别审批
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, targetId, version, requestKey, reason]
              properties:
                kind: {type: string, enum: [PRODUCT_EDIT, PRODUCT_ARCHIVE, SKU_CODE, STOCK_COUNT, RECEIPT_PARTIAL, RETURN_RECEIVE, SHIPMENT_EDIT, ORDER_EDIT, ORDER_COPY, PRODUCT_IMAGE]}
                targetId: {type: string, format: uuid}
                version: {type: integer, minimum: 0, description: 商品资料版本或SKU版本、订单inventory_revision、运单edit_version}
                requestKey: {type: string, format: uuid}
                reason: {type: string, minLength: 1, maxLength: 500}
                name: {type: string, maxLength: 200}
                code: {type: string, maxLength: 64}
                archived: {type: boolean}
                quantity: {type: integer, minimum: 1, maximum: 1000000}
                counted: {type: integer, minimum: 0, maximum: 2147483647}
                expectedOnHand: {type: integer, minimum: 0}
                expectedReserved: {type: integer, minimum: 0}
                warehouseId: {type: string, format: uuid}
                carrier: {type: string, maxLength: 100}
                trackingNumber: {type: string, maxLength: 100}
                lines:
                  type: array
                  items:
                    type: object
                    required: [skuId, quantity]
                    properties:
                      skuId: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 1000000}
      responses:
        '200': {description: id及PENDING或APPLIED；HTTP成功不等于业务已生效}
        '403': {description: 无对应职责}
        '404': {description: 对象不在当前企业}
        '409': {description: 版本、状态、可用库存、数量上限或别名占用冲突}
  /api/business-edits/{sku}:
    get:
      summary: 当前企业商品资料及SKU版本，供编辑刷新
      parameters:
        - {name: sku, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: SKU与商品资料名称、编码、版本及归档状态}
        '404': {description: 当前企业SKU不存在}
  /api/business-edits/order-lines/{id}:
    get:
      summary: 当前企业订单SKU明细，采购快照以十进制字符串返回
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: SKU数组，其他企业对象无数据}
  /api/business-edits/history/{target}:
    get:
      summary: 当前企业对象最近200条修改历史，保留前后状态、原因及人员
      parameters:
        - {name: target, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 修改历史，其他企业对象无数据}

  /api/members:
    get:
      summary: 管理员读取当前企业成员
      responses:
        '200': {description: username与role数组}
    post:
      security: [{session: [], csrf: []}]
      summary: 管理员创建本企业普通成员；请求ADMIN时先创建运营身份并申请独立授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string, minLength: 3, maxLength: 64}
                password: {type: string, minLength: 12, description: 不写入审批正文，仅保存BCrypt密码哈希}
                role: {type: string, enum: [ADMIN, OPERATIONS, WAREHOUSE, FINANCE]}
      responses:
        '200': {description: APPLIED普通成员已创建，或PENDING管理员授权待批准}
        '409': {description: 账号已存在，不能绑定其他已有账号}
  /api/members/role:
    post:
      security: [{session: [], csrf: []}]
      summary: 成员角色变更需另一管理员审核，执行时重新校验最后管理员约束
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: {type: string}
                role: {type: string, enum: [ADMIN, OPERATIONS, WAREHOUSE, FINANCE]}
      responses:
        '200': {description: PENDING或相同角色的APPLIED}
        '403': {description: 非当前企业管理员}
        '404': {description: 成员不在当前企业}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: SESSION}
    csrf: {type: apiKey, in: header, name: X-CSRF-TOKEN}
  schemas:
    Decimal:
      type: string
      pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
      example: '200.00'
