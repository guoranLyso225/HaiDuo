services:
  api:
    environment:
      TRACING_ENABLED: 'true'
      OTEL_TRACES_ENDPOINT: http://otel:4318/v1/traces
  otel:
    image: otel/opentelemetry-collector-contrib:0.139.0
    profiles: [monitoring]
    volumes: ['./monitoring/otel.yml:/etc/otelcol-contrib/config.yaml:ro']
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    volumes:
      - './monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro'
    ports: ['127.0.0.1:9091:9090']
  grafana:
    image: grafana/grafana:12.2.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:3001:3000']
    volumes: ['grafana-data:/var/lib/grafana','./monitoring/provisioning:/etc/grafana/provisioning:ro']
volumes:
  grafana-data:
