name: haiduo-dev
services:
  rabbitmq:
    image: rabbitmq:4.2.1-management
    environment:
      RABBITMQ_DEFAULT_USER: haiduo
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD before starting}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: haiduo
      POSTGRES_USER: haiduo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haiduo -d haiduo"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  rabbit-data:
  postgres-data:
  redis-data:
